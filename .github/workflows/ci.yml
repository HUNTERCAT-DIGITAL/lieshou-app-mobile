name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  frontend:
    name: Frontend (typecheck+build+lint+test)
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout (with open/ submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # 不用 cache: pnpm —— self-hosted runner 的缓存上传目标 Azure Blob
          # (blob.core.windows.net) 本地网络/代理均不通，1.2GB 缓存上传会 0 MB/s 挂死；
          # runner 本地已有全局 pnpm store，install 本就很快（见 .ai/decisions 或 git 记录）。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck + Build + Lint + Test
        run: pnpm run typecheck && pnpm run build && pnpm run lint && pnpm run test
        env:
          CI: true
